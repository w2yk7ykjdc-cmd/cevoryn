name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      paddle_sandbox_api_key:
        description: "Temporary: Paddle sandbox API key for a one-off catalog check"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  paddle-sandbox-catalog-check:
    if: ${{ inputs.paddle_sandbox_api_key != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mask the key in logs
        run: echo "::add-mask::${{ inputs.paddle_sandbox_api_key }}"

      - name: Check the three sandbox price IDs
        env:
          PADDLE_API_KEY: ${{ inputs.paddle_sandbox_api_key }}
        run: |
          for id in "pri_01kyjqfyy4xy5rwn9ptkmj3fn" "pri_01kyjqbwqcsmkt48qd12rwstj1" "pri_01kyjq7njsy7bt9vs768zpv8hw"; do
            echo "=== $id ==="
            curl -sS -D - -o body.json --max-time 15 \
              "https://sandbox-api.paddle.com/prices/$id?include=product" \
              -H "Authorization: Bearer $PADDLE_API_KEY" \
              -H "Accept: application/json"
            echo "--- body ---"
            cat body.json
            echo
          done

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health
        env:
          HEALTH_URL: https://cevoryn.vercel.app/api/health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "$HEALTH_URL")"
          echo "$body" | tee health.json
          node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
            if (health.status !== "ok") throw new Error(`Health status is ${health.status}`);
            if (health.services?.database !== "connected") throw new Error("Database is not connected");
            if (typeof health.responseTimeMs !== "number") throw new Error("Missing response time");
            console.log(`Production healthy in ${health.responseTimeMs}ms`);
          '

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Atlas production smoke"
            echo
            if [ -f health.json ]; then
              echo '```json'
              cat health.json
              echo
              echo '```'
            else
              echo "Health endpoint did not return a usable response."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
