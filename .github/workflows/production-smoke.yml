name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      paddle_webhook_secret:
        description: "Temporary: PADDLE_WEBHOOK_SECRET value to test-sign a webhook request with"
        required: false
        type: string
      paddle_api_key:
        description: "Temporary: sandbox PADDLE_API_KEY to look up the real notification destination secret"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  paddle-notification-secret-check:
    if: ${{ inputs.paddle_api_key != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mask the key in logs
        run: echo "::add-mask::${{ inputs.paddle_api_key }}"

      - name: List sandbox notification destinations
        env:
          PADDLE_API_KEY: ${{ inputs.paddle_api_key }}
        run: |
          curl -sS --max-time 15 \
            "https://sandbox-api.paddle.com/notification-settings" \
            -H "Authorization: Bearer $PADDLE_API_KEY" \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(raw);
                if (!parsed.data) {
                  console.log("No data field in response:", JSON.stringify(parsed, null, 2));
                  return;
                }
                for (const dest of parsed.data) {
                  console.log("---");
                  console.log("id:          ", dest.id);
                  console.log("description: ", dest.description);
                  console.log("destination: ", dest.destination);
                  console.log("active:      ", dest.active);
                  console.log("secret_key:  ", dest.secret_key);
                }
              });
            '

  paddle-webhook-signature-check:
    if: ${{ inputs.paddle_webhook_secret != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mask the secret in logs
        run: echo "::add-mask::${{ inputs.paddle_webhook_secret }}"

      - name: Send a signed test webhook to production
        env:
          PADDLE_WEBHOOK_SECRET: ${{ inputs.paddle_webhook_secret }}
        run: |
          node -e '
            const crypto = require("crypto");
            const secret = process.env.PADDLE_WEBHOOK_SECRET;
            const body = JSON.stringify({ event_id: "evt_test_diag_1", event_type: "test.event", data: {} });
            const ts = Math.floor(Date.now() / 1000);
            const h1 = crypto.createHmac("sha256", secret).update(`${ts}:${body}`).digest("hex");
            const fs = require("fs");
            fs.writeFileSync("body.json", body);
            fs.writeFileSync("signature.txt", `ts=${ts};h1=${h1}`);
          '
          echo "=== Request ==="
          curl -sS -D - -o response.json --max-time 15 \
            "https://cevoryn.vercel.app/api/billing/paddle/webhook" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Paddle-Signature: $(cat signature.txt)" \
            --data-binary @body.json
          echo "--- response body ---"
          cat response.json
          echo

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health
        env:
          HEALTH_URL: https://cevoryn.vercel.app/api/health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "$HEALTH_URL")"
          echo "$body" | tee health.json
          node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
            if (health.status !== "ok") throw new Error(`Health status is ${health.status}`);
            if (health.services?.database !== "connected") throw new Error("Database is not connected");
            if (typeof health.responseTimeMs !== "number") throw new Error("Missing response time");
            console.log(`Production healthy in ${health.responseTimeMs}ms`);
          '

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Atlas production smoke"
            echo
            if [ -f health.json ]; then
              echo '```json'
              cat health.json
              echo
              echo '```'
            else
              echo "Health endpoint did not return a usable response."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
