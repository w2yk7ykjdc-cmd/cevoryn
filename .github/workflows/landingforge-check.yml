name: LandingForge Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        continue-on-error: true
        run: |
          echo "### /api/health"
          curl --silent --show-error --max-time 20 -w "\nhttp_code=%{http_code}\n" \
            "https://cevoryn-pbu6.vercel.app/api/health" | tee health.txt

      - name: Check /login
        continue-on-error: true
        run: |
          echo "### /login"
          curl --silent --show-error --max-time 20 -o login.html -w "http_code=%{http_code}\n" \
            "https://cevoryn-pbu6.vercel.app/login" | tee login-status.txt
          echo "---first 40 lines of body---"
          head -40 login.html

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## LandingForge check"
            echo
            echo "### /api/health"
            echo '```'
            cat health.txt 2>/dev/null || echo "no response"
            echo '```'
            echo
            echo "### /login"
            echo '```'
            cat login-status.txt 2>/dev/null || echo "no response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
