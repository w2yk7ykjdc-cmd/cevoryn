name: LandingForge Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check /api/health
        continue-on-error: true
        run: |
          echo "### /api/health"
          curl --silent --show-error --max-time 20 -w "\nhttp_code=%{http_code}\n" \
            "https://cevoryn-pbu6.vercel.app/api/health" | tee health.txt

      - name: Check /login
        continue-on-error: true
        run: |
          echo "### /login"
          curl --silent --show-error --max-time 20 -o login.html -w "http_code=%{http_code}\n" \
            "https://cevoryn-pbu6.vercel.app/login" | tee login-status.txt
          echo "---first 40 lines of body---"
          head -40 login.html

      - name: Check /api/auth (signup)
        continue-on-error: true
        run: |
          echo "### /api/auth signup"
          testEmail="ci-check-$(date +%s)@gmail.com"
          curl --silent --show-error --max-time 20 -w "\nhttp_code=%{http_code}\n" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"email\":\"$testEmail\",\"password\":\"Debug123456!\",\"mode\":\"signup\"}" \
            "https://cevoryn-pbu6.vercel.app/api/auth" | tee auth.txt

      - name: Check /api/debug-signup
        continue-on-error: true
        run: |
          echo "### /api/debug-signup"
          curl --silent --show-error --max-time 20 -w "\nhttp_code=%{http_code}\n" \
            "https://cevoryn-pbu6.vercel.app/api/debug-signup" | tee debug-signup.txt

      - name: Set up Node for browser flow test
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Browser flow - signup then dashboard
        continue-on-error: true
        run: |
          cat > flow.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const email = `ci-flow-${Date.now()}@gmail.com`;
            const password = 'Debug123456!';
            const base = 'https://cevoryn-pbu6.vercel.app';

            const log = (...args) => console.log(...args);

            page.on('console', (msg) => log('[console]', msg.type(), msg.text()));
            page.on('pageerror', (err) => log('[pageerror]', err.message));

            log('Navigating to /login');
            await page.goto(`${base}/login`, { waitUntil: 'networkidle' });

            await page.fill('input[type="email"]', email);
            await page.fill('input[type="password"]', password);
            log('Submitting signup form for', email);
            await Promise.all([
              page.waitForURL(/.*/, { timeout: 15000 }).catch(() => {}),
              page.click('button[type="submit"]'),
            ]);

            await page.waitForTimeout(3000);
            log('URL after submit:', page.url());

            if (!page.url().includes('/dashboard')) {
              log('Not redirected to dashboard automatically, navigating manually');
              await page.goto(`${base}/dashboard`, { waitUntil: 'networkidle' });
            }

            await page.waitForTimeout(1000);
            const bodyText = await page.evaluate(() => document.body.innerText);
            log('=== DASHBOARD PAGE BODY START ===');
            log(bodyText);
            log('=== DASHBOARD PAGE BODY END ===');

            await browser.close();
          })().catch((e) => {
            console.error('FLOW SCRIPT ERROR', e);
            process.exit(1);
          });
          EOF
          node flow.js | tee flow.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## LandingForge check"
            echo
            echo "### /api/health"
            echo '```'
            cat health.txt 2>/dev/null || echo "no response"
            echo '```'
            echo
            echo "### /login"
            echo '```'
            cat login-status.txt 2>/dev/null || echo "no response"
            echo '```'
            echo
            echo "### /api/auth signup"
            echo '```'
            cat auth.txt 2>/dev/null || echo "no response"
            echo '```'
            echo
            echo "### /api/debug-signup"
            echo '```'
            cat debug-signup.txt 2>/dev/null || echo "no response"
            echo '```'
            echo
            echo "### Browser flow (signup -> dashboard)"
            echo '```'
            cat flow.txt 2>/dev/null || echo "no response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
