name: CompanyOS CI

on:
  push:
    branches: [main]
    paths:
      - "companyos/**"
      - ".github/workflows/companyos-ci.yml"
  pull_request:
    paths:
      - "companyos/**"
      - ".github/workflows/companyos-ci.yml"

concurrency:
  group: companyos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companyos

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos
          POSTGRES_DB: companyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companyos -d companyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://companyos:companyos@localhost:5432/companyos?schema=public
      DIRECT_URL: postgresql://companyos:companyos@localhost:5432/companyos?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companyos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
