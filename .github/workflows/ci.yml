name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: atlas

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cevoryn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cevoryn
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cevoryn
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      OPENAI_API_KEY: test-openai-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check for unreviewed destructive migrations
        run: npm run db:check-destructive-migrations

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="origin/${{ github.base_ref }}"
          else
            diff_base="${{ github.event.before }}"
          fi

          if [ -z "$diff_base" ] || [ "$diff_base" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid previous commit is available; checking all source files."
            npm run format:check
            exit $?
          fi

          git diff --name-only --diff-filter=ACMR "$diff_base...HEAD" -- \
            'atlas/src/**/*.ts' 'atlas/src/**/*.tsx' 'atlas/src/**/*.css' 'atlas/src/**/*.json' \
            | sed 's#^atlas/##' > prettier-files.txt

          if [ ! -s prettier-files.txt ]; then
            echo "No changed source files require formatting checks."
            exit 0
          fi

          xargs npx prettier --check < prettier-files.txt

      - name: Test
        run: npm test

      - name: Integration tests (real Postgres service container)
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cevoryn
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Browser E2E smoke tests
        run: npm run test:e2e
