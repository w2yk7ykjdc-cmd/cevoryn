name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cevoryn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - name: Integration tests (real Postgres service container)
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cevoryn_ci
        run: npm run test:integration

      - run: npm run build
